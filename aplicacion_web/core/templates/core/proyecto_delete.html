{% extends "core/base.html" %}

{% block title %}Eliminar proyecto{% endblock title %}

{% block content %}
<h2>Eliminar proyecto</h2>
<p>¿Seguro que quieres eliminar <b>proyecto:</b>"{{ object.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Sí, eliminar</button>
    <a class="btn btn-light"href="{% url 'dashboard' %}">Cancelar</a>
</form>
{% endblock content %}
