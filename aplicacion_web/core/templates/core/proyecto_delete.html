{% extends "core/base.html" %}

{% block title %}Eliminar proyecto{% endblock title %}

{% block content %}
<h2>Eliminar proyecto</h2>
<p>¿Seguro que quieres eliminar "{{ object.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'proyecto_list' %}">Cancelar</a>
</form>
{% endblock content %}
